<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>새 일기 작성 | My Diary</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Custom CSS -->
  <link rel="stylesheet" href="my.css">
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container py-2">

      <a class="navbar-brand fw-bold" href="index.html">
        My Diary
      </a>

      <a href="index.html" class="btn btn-outline-secondary">
        목록으로
      </a>

    </div>
  </nav>


  <!-- Main -->
  <main class="container my-5">

    <div class="row justify-content-center">

      <div class="col-lg-8 col-xl-7">

        <!-- Page Header -->
        <div class="mb-4">
          <p class="text-secondary mb-2">
            오늘 하루는 어땠나요?
          </p>

          <h1 class="fw-bold">
            새 일기 작성
          </h1>
        </div>


        <!-- Diary Form -->
        <div class="card diary-form-card">

          <div class="card-body p-4 p-md-5">

            <form>

              <!-- Title -->
              <div class="mb-4">

                <label
                  for="title"
                  class="form-label fw-semibold"
                >
                  제목
                </label>

                <input
                  type="text"
                  class="form-control form-control-lg"
                  id="title"
                  name="title"
                  placeholder="오늘 하루를 한 문장으로 표현해보세요"
                  required
                >

              </div>


              <!-- Date -->
              <div class="mb-4">

                <label
                  for="date"
                  class="form-label fw-semibold"
                >
                  날짜
                </label>

                <input
                  type="date"
                  class="form-control"
                  id="date"
                  name="date"
                  required
                >

              </div>


              <!-- Mood -->
              <div class="mb-4">

                <label
                  for="mood"
                  class="form-label fw-semibold"
                >
                  오늘의 기분
                </label>

                <select
                  class="form-select"
                  id="mood"
                  name="mood"
                >

                  <option selected disabled>
                    오늘의 기분을 선택해주세요
                  </option>

                  <option value="happy">
                    😊 행복
                  </option>

                  <option value="good">
                    😄 좋음
                  </option>

                  <option value="normal">
                    🌿 평범
                  </option>

                  <option value="tired">
                    😴 피곤
                  </option>

                  <option value="sad">
                    😢 슬픔
                  </option>

                </select>

              </div>


              <!-- Content -->
              <div class="mb-4">

                <label
                  for="content"
                  class="form-label fw-semibold"
                >
                  내용
                </label>

                <textarea
                  class="form-control"
                  id="content"
                  name="content"
                  rows="10"
                  placeholder="오늘 있었던 일이나 기억하고 싶은 순간을 자유롭게 적어보세요."
                  required
                ></textarea>

              </div>


              <!-- Buttons -->
              <div
                class="d-flex justify-content-end gap-2 pt-3 border-top"
              >

                <a
                  href="index.html"
                  class="btn btn-outline-secondary px-4"
                >
                  취소
                </a>

                <button
                  type="submit"
                  class="btn btn-dark px-4"
                >
                 <a href="index.html" class="text-white text-decoration-none">일기 저장</a>
                </button>

              </div>

            </form>

          </div>

        </div>

      </div>

    </div>

  </main>

</body>
</html>
