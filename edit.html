<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>일기 수정 | My Diary</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Custom CSS -->
  <link rel="stylesheet" href="my.css">
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container py-2">

      <a class="navbar-brand fw-bold" href="index.html">
        My Diary
      </a>

      <a href="index.html" class="btn btn-outline-secondary">
        목록으로
      </a>

    </div>
  </nav>


  <!-- Main -->
  <main class="container my-5">

    <div class="row justify-content-center">

      <div class="col-lg-8 col-xl-7">

        <!-- Header -->
        <div class="mb-4">

          <p class="text-secondary mb-2">
            작성한 일기를 수정해보세요.
          </p>

          <h1 class="fw-bold">
            일기 수정
          </h1>

        </div>


        <!-- Edit Form -->
        <div class="card diary-form-card">

          <div class="card-body p-4 p-md-5">

            <form>

              <!-- Title -->
              <div class="mb-4">

                <label
                  for="title"
                  class="form-label fw-semibold"
                >
                  제목
                </label>

                <input
                  type="text"
                  class="form-control form-control-lg"
                  id="title"
                  name="title"
                  value="즐거웠던 하루"
                  required
                >

              </div>


              <!-- Date -->
              <div class="mb-4">

                <label
                  for="date"
                  class="form-label fw-semibold"
                >
                  날짜
                </label>

                <input
                  type="date"
                  class="form-control"
                  id="date"
                  name="date"
                  value="2026-09-18"
                  required
                >

              </div>


              <!-- Mood -->
              <div class="mb-4">

                <label
                  for="mood"
                  class="form-label fw-semibold"
                >
                  오늘의 기분
                </label>

                <select
                  class="form-select"
                  id="mood"
                  name="mood"
                >

                  <option value="happy" selected>
                    😊 행복
                  </option>

                  <option value="good">
                    😄 좋음
                  </option>

                  <option value="normal">
                    🌿 평범
                  </option>

                  <option value="tired">
                    😴 피곤
                  </option>

                  <option value="sad">
                    😢 슬픔
                  </option>

                </select>

              </div>


              <!-- Content -->
              <div class="mb-4">

                <label
                  for="content"
                  class="form-label fw-semibold"
                >
                  내용
                </label>

                <textarea
                  class="form-control"
                  id="content"
                  name="content"
                  rows="10"
                  required
                >오늘은 친구들과 맛있는 음식을 먹고 카페에 갔다. 오랜만에 만나서 이런저런 이야기를 나누었다. 날씨도 좋아서 기분 좋은 하루였다.</textarea>

              </div>


              <!-- Buttons -->
              <div
                class="d-flex justify-content-between align-items-center pt-3 border-top"
              >

                <!-- Delete -->
                <button
                  type="button"
                  class="btn btn-outline-danger"
                >
                  삭제
                </button>


                <!-- Cancel / Save -->
                <div class="d-flex gap-2">

                  <a
                    href="index.html"
                    class="btn btn-outline-secondary px-4"
                  >
                    취소
                  </a>

                  <button
                    type="submit"
                    class="btn btn-dark px-4"
                  >
                   <a href="index.html" class="text-white text-decoration-none">수정 완료</a>
                  </button>

                </div>

              </div>

            </form>

          </div>

        </div>

      </div>

    </div>

  </main>

</body>
</html>
