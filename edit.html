<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>일기 수정 | My Diary</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="my.css">
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-white border-bottom">

    <div class="container py-2">

      <a class="navbar-brand fw-bold" href="index.html">
        My Diary
      </a>

      <a href="index.html" class="btn btn-outline-secondary">
        목록으로
      </a>

    </div>

  </nav>


  <!-- Main -->
  <main class="container my-5">

    <div class="row justify-content-center">

      <div class="col-lg-8 col-xl-7">


        <!-- Header -->
        <div class="mb-4">

          <p class="text-secondary mb-2">
            작성한 일기의 내용을 수정할 수 있습니다.
          </p>

          <h1 class="fw-bold">
            일기 수정
          </h1>

        </div>


        <!-- Form -->
        <div class="card diary-form-card">

          <div class="card-body p-4 p-md-5">

            <form
              action="index.html"
              method="get"
              onsubmit="return confirm('정말 수정하시겠습니까?');"
            >


              <!-- 제목 -->
              <div class="mb-4">

                <label
                  for="title"
                  class="form-label fw-semibold"
                >
                  제목
                  <span class="text-danger">*</span>
                </label>

                <input
                  type="text"
                  class="form-control form-control-lg"
                  id="title"
                  name="title"

                  value="즐거웠던 하루"

                  required
                  minlength="2"
                  maxlength="30"
                  pattern="[가-힣a-zA-Z0-9\s!?.,]+"

                  title="제목은 2자 이상 30자 이하로 입력해주세요."
                >

              </div>


              <!-- 날짜 -->
              <div class="mb-4">

                <label
                  for="date"
                  class="form-label fw-semibold"
                >
                  날짜
                  <span class="text-danger">*</span>
                </label>

                <input
                  type="date"
                  class="form-control"
                  id="date"
                  name="date"

                  value="2026-09-18"

                  min="2020-01-01"
                  max="2026-12-31"

                  required
                >

              </div>


              <!-- 기분 -->
              <div class="mb-4">

                <label
                  for="mood"
                  class="form-label fw-semibold"
                >
                  오늘의 기분
                  <span class="text-danger">*</span>
                </label>

                <select
                  class="form-select"
                  id="mood"
                  name="mood"
                  required
                >

                  <option value="">
                    기분을 선택해주세요
                  </option>

                  <!-- 기존 값 -->
                  <option value="happy" selected>
                    😊 행복
                  </option>

                  <option value="good">
                    😄 좋음
                  </option>

                  <option value="normal">
                    🌿 평범
                  </option>

                  <option value="tired">
                    😴 피곤
                  </option>

                  <option value="sad">
                    😢 슬픔
                  </option>

                </select>

              </div>


              <!-- 날씨 -->
              <div class="mb-4">

                <label
                  for="weather"
                  class="form-label fw-semibold"
                >
                  오늘의 날씨
                  <span class="text-danger">*</span>
                </label>

                <select
                  class="form-select"
                  id="weather"
                  name="weather"
                  required
                >

                  <option value="">
                    날씨를 선택해주세요
                  </option>

                  <!-- 기존 값 -->
                  <option value="sunny" selected>
                    ☀️ 맑음
                  </option>

                  <option value="cloudy">
                    ☁️ 흐림
                  </option>

                  <option value="rainy">
                    🌧️ 비
                  </option>

                  <option value="snowy">
                    ❄️ 눈
                  </option>

                  <option value="windy">
                    🌬️ 바람
                  </option>

                </select>

              </div>


              <!-- 장소 -->
              <div class="mb-4">

                <label
                  for="location"
                  class="form-label fw-semibold"
                >
                  장소
                  <span class="text-danger">*</span>
                </label>

                <input
                  type="text"
                  class="form-control"
                  id="location"
                  name="location"

                  value="영일대 해수욕장"

                  required
                  minlength="2"
                  maxlength="30"
                >

                <div class="form-text">
                  장소는 2자 이상 30자 이하로 입력해주세요.
                </div>

              </div>


              <!-- 내용 -->
              <div class="mb-4">

                <label
                  for="content"
                  class="form-label fw-semibold"
                >
                  내용
                  <span class="text-danger">*</span>
                </label>

                <textarea
                  class="form-control"
                  id="content"
                  name="content"

                  rows="10"

                  required
                  minlength="10"
                  maxlength="1000"
                >오늘은 친구들과 맛있는 음식을 먹고 카페에 갔다. 오랜만에 만나서 이런저런 이야기를 나누었다. 날씨도 좋아서 기분 좋은 하루였다.</textarea>

                <div class="form-text">
                  일기 내용은 10자 이상 1000자 이하로 작성해주세요.
                </div>

              </div>


              <!-- Buttons -->
              <div
                class="d-flex justify-content-end gap-2 pt-3 border-top"
              >

                <a
                  href="index.html"
                  class="btn btn-outline-secondary px-4"
                >
                  취소
                </a>

                <button
                  type="submit"
                  class="btn btn-dark px-4"
                >
                  수정
                </button>

              </div>

            </form>

          </div>

        </div>

      </div>

    </div>

  </main>

</body>
</html>
